<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grade Statistics</title>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: #ffffff;
    }

    h1 {
        text-align: center;
        font-size: 48px;
        margin-bottom: 40px;
    }

    /* 輸入區 */
    .input-area {
        margin-bottom: 30px;
    }

    .input-area input {
        width: 160px;
        padding: 8px;
        margin-right: 10px;
        border: 1px solid #aaa;
        border-radius: 4px;
    }

    .input-area button {
        padding: 8px 16px;
        border: 1px solid #aaa;
        background-color: #f2f2f2;
        border-radius: 4px;
        cursor: pointer;
    }

    /* 表格 */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid #e0e0e0;
        padding: 14px;
        text-align: center;
        font-size: 18px;
    }

    thead th {
        background-color: #f7f7f7;
        font-weight: bold;
    }

    tfoot td {
        font-weight: bold;
        background-color: #f7f7f7;
    }

    .index-col {
        width: 10%;
    }
</style>
</head>

<body>

<h1>Grade Statistics</h1>

<div class="input-area">
    <input type="number" id="mathInput" placeholder="Math">
    <input type="number" id="engInput" placeholder="English">
    <button onclick="addGrade()">Submit</button>
</div>

<table>
    <thead>
        <tr>
            <th class="index-col">#</th>
            <th>Math</th>
            <th>English</th>
            <th>Average</th>
        </tr>
    </thead>

    <tbody id="tableBody">
    </tbody>

    <tfoot>
        <tr>
            <td>Average</td>
            <td id="mathAvg">0.00</td>
            <td id="engAvg">0.00</td>
            <td id="overallAvg">0.00</td>
        </tr>
    </tfoot>
</table>

<script>
    var count = 0;
    var mathTotal = 0;
    var engTotal = 0;

    function addGrade() {
    var math = Number(document.getElementById("mathInput").value);
    var eng = Number(document.getElementById("engInput").value);

    if (isNaN(math) || isNaN(eng)) {
        alert("Please enter valid numbers.");
        return;
    }

    count++;
    mathTotal += math;
    engTotal += eng;

    var avg = ((math + eng) / 2).toFixed(2);

    var row = "<tr>";
    row += "<td>" + count + "</td>";
    row += "<td>" + math + "</td>";
    row += "<td>" + eng + "</td>";
    row += "<td>" + avg + "</td>";
    row += "</tr>";

    document.getElementById("tableBody").innerHTML += row;

    document.getElementById("mathAvg").innerText = (mathTotal / count).toFixed(2);
    document.getElementById("engAvg").innerText = (engTotal / count).toFixed(2);
    document.getElementById("overallAvg").innerText = ((mathTotal / count + engTotal / count) / 2).toFixed(2);
    document.getElementById("mathInput").value = "";
    document.getElementById("engInput").value = "";
}

</script>

</body>
</html>
