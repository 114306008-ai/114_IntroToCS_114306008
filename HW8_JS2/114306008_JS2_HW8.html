<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Calculator</title>

    <style>
        
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

       
        .card {
            background-color: white;
            width: 320px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #8b5a2b;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6f451f;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>JS Calculator</h1>

    <label>Number 1</label>
    <input type="number" id="num1" value="30">

    <label>Number 2</label>
    <input type="number" id="num2" value="60">

    <label>Operate way?</label>
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <button onclick="calculate()">Add</button>

    <div class="result" id="result">Result = 0.00</div>
</div>

<script>
    function calculate() {
        var n1 = Number(document.getElementById("num1").value);
        var n2 = Number(document.getElementById("num2").value);
        var op = document.getElementById("operator").value;
        var ans = 0;

        if (op === "+") {
            ans = n1 + n2;
        } else if (op === "-") {
            ans = n1 - n2;
        } else if (op === "*") {
            ans = n1 * n2;
        } else if (op === "/") {
            if (n2 === 0) {
                alert("Cannot divide by zero");
                return;
            }
            ans = n1 / n2;
        }

        document.getElementById("result").innerText =
            "Result = " + ans.toFixed(2);
    }
</script>

</body>
</html>
